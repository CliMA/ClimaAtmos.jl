# Baroclinic wave (JW06) over smoothed Earth topography (ETOPO2022 ->
# SpaceVaryingInput -> diffusion smoothing -> LinearAdaption warp).
# CAUTION: for the FDDG (Cartesian) core terrain is geometry plumbing only
# (metric cross-terms absent) — gentle smoothed slopes only; see README.
helem: 8
npoly: 4
zelem: 20
zmax: 30000.0
zstretch: [300.0, 3000.0]
stepper: hevi
dt: 60.0
t_end: 86400.0
perturb: true
topography: earth
topography_damping_factor: 5.0
interface_flux: roe
# kappa4 defaults to SIPG cap/10: over topography run stabilized.
constants_mode: clima_params
ic_source: setups
held_suarez: false
ndiag: 60
