# Baroclinic wave (JW06) over the Hughes & Jablonowski (2023) analytic
# double mountain — the validated terrain stack:
#   face_set: es      exact-KEP centrals + entropy-variable ρe dissipation
#   kappa4_frac       resolution/dt-safe hyperdiffusion (terrain-aware form)
#   nu_div_frac       divergence damping for impulsive-start transients
#   nu_vert           breaking-wave momentum deposition in the sponge layer
#   sponge            w-only (never uh), top 10 km
# Verification: test/test_vi_kep_budget.jl; derivation and terrain findings:
# docs/vi_kep_face_terms.md. 8 days at helem 16 is ~13 h wall single-core.
core: vi
face_set: es
momentum_adv: vector_invariant
kappa4_frac: 0.1
nu_div_frac: 0.3
nu_vert: 1500.0
helem: 16
npoly: 4
zelem: 20
zmax: 30000.0
zstretch: [300.0, 3000.0]
sponge_depth: 15000.0
sponge_tau: 20.0       # implicit w-sponge; tau=1 (CA alpha_w) is fidelity-neutral but ~10x Newton cost — 20 s absorbs on ~3 steps at benchmark speed
stepper: hevi
dt: 60.0
t_end: 691200.0        # 8 days
perturb: true
topography: hughes2023
constants_mode: clima_params
ic_source: setups
output_dir: output_dg_bw_double_mountain_kep
diag_period: 21600.0   # 6-hourly snapshots (32 frames)
ndiag: 60
