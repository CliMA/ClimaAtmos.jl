# Baroclinic wave (JW06) over the Hughes & Jablonowski (2023) analytic
# double mountain: vector-invariant core, KEP face set, no cutoff filter
# (KE-budget verification: test/test_vi_kep_budget.jl; derivation and
# terrain findings: docs/vi_kep_face_terms.md).
#
# KNOWN LIMIT at helem 8: the 2.3° ridges sit at node scale, and the
# amplifying mountain waves aloft crash the run after ~1-2 h simulated
# (docs §8); helem 16 resolves the forcing. Sponge acts on w ONLY (a uₕ
# sponge drags the jet, not the waves).
core: vi
face_set: es
momentum_adv: vector_invariant
kappa4_frac: 0.1       # fraction of the SIPG cap Δh³/((2n+1)²Δt) —
                       # resolution/Δt-safe at any helem; terrain-aware
                       # (perturbation-from-base-state) form
helem: 8
npoly: 4
zelem: 20
zmax: 30000.0
zstretch: [300.0, 3000.0]
stepper: hevi
dt: 60.0
t_end: 864000.0        # 10 days
perturb: true
topography: hughes2023
constants_mode: clima_params
ic_source: setups
held_suarez: false
output_dir: output_dg_bw_double_mountain_kep
diag_period: 86400.0
ndiag: 120
