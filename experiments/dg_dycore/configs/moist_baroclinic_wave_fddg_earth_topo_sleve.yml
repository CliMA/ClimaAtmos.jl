# Moist baroclinic wave on the FDDG core WITH Earth topography (ETOPO2022),
# SLEVE vertical coordinate. Mirrors moist_baroclinic_wave_fddg_earth_topo.yml
# with the CG-system SLEVE parameters (SLEVEWarp defaults: eta 0.7, s 10.0 —
# for s ≫ 1 the warp decays ≈ linearly below ηₕ·zmax, so near-surface cells
# keep ≈ their linear-warp thickness, Δz_min 220 m vs 244 m linear, while all
# levels flatten above 21 km). Aggressive SLEVE (0.5, 0.5) compresses the
# bottom cell to ~70 m over the Himalaya and is NOT steppable.
#
# dt = 45 (not 120): with the terrain cross-term carried in the vertical
# fluxes (flux_form.jl), the resolved orographic response (w ≈ 3–4 m/s) binds
# the EXPLICIT vertical-advective CFL dt ≲ Δz_min/w — HEVI makes only the
# vertical acoustics implicit. Verified clean at dt = 45 (2026-09).
core: fddg
float_type: Float64

helem: 16
npoly: 3
zelem: 30
stepper: hevi
dt: 45.0
t_end: 864000.0
perturb: false

volume_flux: waruszewski
interface_flux: roe
pgf: conservative_pert

topography: earth
topography_damping_factor: 1.0
terrain_warp: sleve
sleve_eta_h: 0.7
sleve_s: 10.0
zstretch: [300.0, 3000.0]

moisture: equil
microphysics: zero_moment
moisture_ic: dcmip
rh_max: 1.0
q_0: 0.018
z_q1: 3000.0
z_q2: 8000.0

output_dir: output/moist_baroclinic_wave_fddg_earth_topo_sleve
diag_period: 86400.0
dt_save: 21600.0
ndiag: 60
