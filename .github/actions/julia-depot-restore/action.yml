name: Restore Julia depot
description: >-
  Restore the cached Julia depot for `prefix-hash`, or the most recent one
  whose key starts with `prefix-`. Pair with `julia-depot-save`, which saves
  only from pushes to main, so every run reads the cache that main wrote.
inputs:
  prefix:
    description: Key prefix, unique per workflow, Julia version, and runner OS.
    required: true
  hash:
    description: Hash of the files that set the dependencies, from `hashFiles`.
    required: true
outputs:
  key:
    description: Full cache key, `prefix-hash`.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: Whether a cache with the full key was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@v6
      with:
        # Keep in sync with the path list in julia-depot-save.
        path: |
          ~/.julia/artifacts
          ~/.julia/compiled
          ~/.julia/logs
          ~/.julia/packages
          ~/.julia/registries
          ~/.julia/scratchspaces
        key: ${{ inputs.prefix }}-${{ inputs.hash }}
        restore-keys: ${{ inputs.prefix }}-
