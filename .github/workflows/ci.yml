name: ci
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches and pull requests, but not on `main`, 
  # so that the workflow badge does not report a cancellation as "failing".
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: write
  contents: read

jobs:
  # Merge-queue fast path: decide whether the matrix below can be reused from an
  # already-green PR head (see .github/should_skip_merge_queue.sh). Always runs;
  # only ever returns skip=true for a merge_group build that is provably
  # identical to a PR whose "ci " checks already passed.
  decide:
    name: decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if .github/should_skip_merge_queue.sh "ci "; then
            echo "Merge-queue CI skipped: reusing this PR's green checks."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # The test-group list lives in test-groups.yml, which upstream packages also
  # call to run these tests in their downstream tests
  test:
    name: ci 1.13
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    uses: ./.github/workflows/test-groups.yml
    with:
      julia-version: '1.13'
      develop-caller: false
      coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-julia-1_10:
    name: ci 1.10
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    uses: ./.github/workflows/test-groups.yml
    with:
      julia-version: '1.10'
      test-groups: '["infrastructure"]'
      develop-caller: false
      coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Musica supports Julia 1.11 and 1.12, so its test runs in its own
  # environment on 1.12.
  musica:
    name: musica 1.12 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - id: depot
        uses: ./.github/actions/julia-depot-restore
        with:
          prefix: musica-julia1.12-${{ runner.os }}
          hash: ${{ hashFiles('Project.toml', 'test/musica/Project.toml') }}
      - run: >-
          julia --color=yes --project=test/musica -e
          'using Pkg; Pkg.instantiate(); include("test/musica/runtests.jl")'
      - uses: ./.github/actions/julia-depot-save
        if: ${{ !cancelled() }}
        with:
          key: ${{ steps.depot.outputs.key }}
          cache-hit: ${{ steps.depot.outputs.cache-hit }}

  # Single required status check for branch protection / the merge queue. Set
  # THIS ("ci-required") as the required check instead of the individual matrix
  # jobs, so a reused merge-queue build (matrix skipped) still reports green.
  ci-required:
    name: ci-required
    needs: [decide, test, test-julia-1_10]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DECIDE: ${{ needs.decide.result }}
          SKIP: ${{ needs.decide.outputs.skip }}
          RESULTS: ${{ needs.test.result }} ${{ needs.test-julia-1_10.result }}
        run: |
          if [[ "$DECIDE" != "success" ]]; then
            echo "decide job did not succeed"; exit 1
          fi
          if [[ "$RESULTS" == "success success" ]]; then
            echo "ci matrix passed"; exit 0
          fi
          if [[ "$RESULTS" == "skipped skipped" && "$SKIP" == "true" ]]; then
            echo "ci matrix reused from an already-green PR head"; exit 0
          fi
          echo "ci matrix did not pass (results: $RESULTS)"
          exit 1
