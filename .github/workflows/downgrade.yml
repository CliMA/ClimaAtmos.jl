name: Downgrade
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Downgrade ${{ matrix.version }} - ubuntu-latest
    runs-on: ubuntu-latest
    # julia-downgrade-compat rewrites Project.toml (test extras are promoted to
    # deps), which makes Aqua's stale-dependency check meaningless here.
    env:
      CLIMAATMOS_DOWNGRADE_CI: 'true'
    strategy:
      matrix:
        version: ['1.10']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
      - id: depot
        uses: ./.github/actions/julia-depot-restore
        with:
          prefix: downgrade-julia${{ matrix.version }}-${{ runner.os }}
          hash: ${{ hashFiles('Project.toml') }}
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: Artifacts, Dates, Downloads, LazyArtifacts, LinearAlgebra, Logging, Printf, Test, Statistics, Random, Pkg, Glib_jll, Musica
          mode: 'forcedeps'

      - uses: julia-actions/julia-buildpkg@latest
      - name: Run infrastructure tests
        uses: julia-actions/julia-runtest@latest
        with:
          coverage: false
        env:
          TEST_GROUP: infrastructure
      - uses: ./.github/actions/julia-depot-save
        if: ${{ !cancelled() }}
        with:
          key: ${{ steps.depot.outputs.key }}
          cache-hit: ${{ steps.depot.outputs.cache-hit }}
