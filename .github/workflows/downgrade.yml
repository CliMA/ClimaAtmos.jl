name: Downgrade
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Downgrade ${{ matrix.version }} - ubuntu-latest
    runs-on: ubuntu-latest
    # julia-downgrade-compat rewrites Project.toml (test extras are promoted to
    # deps), which makes Aqua's stale-dependency check meaningless here.
    env:
      CLIMAATMOS_DOWNGRADE_CI: 'true'
    strategy:
      matrix:
        version: ['1.10']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
      - id: depot
        uses: ./.github/actions/julia-depot-restore
        with:
          prefix: downgrade-julia${{ matrix.version }}-${{ runner.os }}
          hash: ${{ hashFiles('Project.toml') }}
      # Temporary: remove when the parameter packages with `@params` are
      # released. julia-downgrade-compat cannot write a manifest for a project
      # with url [sources], so this step deletes them.
      - run: sed -i '/rev = "dy\//d' Project.toml
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          # Temporary: stop skipping Thermodynamics, SurfaceFluxes, and Aqua when
          # the parameter packages with `@params` are released. The next step
          # adds the branches of the first two. Aqua's oldest versions test
          # persistent tasks in an environment without those branches.
          skip: Artifacts, Dates, Downloads, LazyArtifacts, LinearAlgebra, Logging, Printf, Test, Statistics, Random, Pkg, Glib_jll, Musica, Thermodynamics, SurfaceFluxes, Aqua
          mode: 'forcedeps'
      # Temporary: remove when the parameter packages with `@params` are
      # released.
      - run: using Pkg; Pkg.add([PackageSpec(; url = "https://github.com/CliMA/" * name * ".jl", rev) for (name, rev) in (("Thermodynamics", "dy/params_macro"), ("SurfaceFluxes", "dy/params_macro"))])
        shell: julia --color=yes --project=. {0}

      - uses: julia-actions/julia-buildpkg@latest
      - name: Run infrastructure tests
        uses: julia-actions/julia-runtest@latest
        with:
          coverage: false
        env:
          TEST_GROUP: infrastructure
      - uses: ./.github/actions/julia-depot-save
        if: ${{ !cancelled() }}
        with:
          key: ${{ steps.depot.outputs.key }}
          cache-hit: ${{ steps.depot.outputs.cache-hit }}
