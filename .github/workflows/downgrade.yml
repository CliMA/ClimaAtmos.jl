name: Downgrade
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'

# Needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Downgrade ${{ matrix.version }} - ${{ matrix.test_group }}
    runs-on: ubuntu-latest
    # julia-downgrade-compat rewrites Project.toml (test extras are promoted to
    # deps), which makes Aqua's stale-dependency check meaningless here.
    env:
      CLIMAATMOS_DOWNGRADE_CI: 'true'
    strategy:
      # Without this, a failure on one version cancels the other before it
      # reports, so a version-specific regression is indistinguishable from a
      # shared one. Matches the ci workflow.
      fail-fast: false
      matrix:
        version: ['1.10', '1.11']
        # One job per group rather than one job running them in sequence. Run
        # sequentially, the first failing group ends the job and every later
        # group silently goes unrun, so a red downgrade job says nothing about
        # the groups behind the failure. With `fail-fast: false` above, each
        # group now reports its own result.
        test_group:
          - infrastructure
          - diagnostics
          - dynamics
          - dynamics_tracers
          - dynamics_edmfx
          - tagging_energy
          - tagging_water
          - tagging_source
          - tagging_record
          - parameterizations
          - restarts
          - era5
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: Artifacts, Dates, Downloads, LazyArtifacts, LinearAlgebra, Logging, Printf, Test, Statistics, Random, Pkg, Glib_jll, Musica
          mode: 'forcedeps'

      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: ${{ matrix.test_group }}
