name: Downgrade
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Downgrade ${{ matrix.version }} - ubuntu-latest
    runs-on: ubuntu-latest
    # julia-downgrade-compat rewrites Project.toml (test extras are promoted to
    # deps), which makes Aqua's stale-dependency check meaningless here.
    env:
      CLIMAATMOS_DOWNGRADE_CI: 'true'
    strategy:
      matrix:
        version: ['1.10']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
      - id: depot
        uses: ./.github/actions/julia-depot-restore
        with:
          prefix: downgrade-julia${{ matrix.version }}-${{ runner.os }}
          hash: ${{ hashFiles('Project.toml') }}
      # Temporary: remove when the parameter packages with `@params` are released.
      # julia-downgrade-compat cannot write a manifest for a project with url [sources],
      # so it resolves the registered versions, which the next step replaces.
      - run: sed -i '/rev = "dy\/params_macro"/d' Project.toml
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          # Temporary: Thermodynamics, SurfaceFluxes, and CloudMicrophysics are skipped until
          # the packages with `@params` are released, so that the next step can add their branches, and
          # so is Aqua, whose oldest versions test persistent tasks in an environment without them.
          skip: Artifacts, Dates, Downloads, LazyArtifacts, LinearAlgebra, Logging, Printf, Test, Statistics, Random, Pkg, Glib_jll, Musica, Thermodynamics, SurfaceFluxes, CloudMicrophysics, Aqua
          mode: 'forcedeps'
      # Temporary: remove when the parameter packages with `@params` are released.
      - run: using Pkg; Pkg.add([PackageSpec(; url = "https://github.com/CliMA/" * name * ".jl", rev = "dy/params_macro") for name in ("Thermodynamics", "SurfaceFluxes", "CloudMicrophysics")])
        shell: julia --color=yes --project=. {0}

      - uses: julia-actions/julia-buildpkg@latest
      - name: Run infrastructure tests
        uses: julia-actions/julia-runtest@latest
        with:
          coverage: false
        env:
          TEST_GROUP: infrastructure
      - uses: ./.github/actions/julia-depot-save
        if: ${{ !cancelled() }}
        with:
          key: ${{ steps.depot.outputs.key }}
          cache-hit: ${{ steps.depot.outputs.cache-hit }}
