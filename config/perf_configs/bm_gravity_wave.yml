apply_sem_quasimonotone_limiter: true
h_elem: 12
rayleigh_sponge: false
viscous_sponge: false
dt: "1secs"
t_end: "10secs"
log_progress: false
surface_setup: "DefaultMoninObukhov"
rad: "allskywithclear"
vert_diff: "VerticalDiffusion"
microphysics_model: "0M"
orographic_gravity_wave: "raw_topo"
topography: "Earth"
topo_smoothing: true
non_orographic_gravity_wave: true
# Update both gravity-wave drags every step, so the measured step includes their compute.
dt_ogw: "1secs"
dt_nogw: "1secs"
toml:
  - "toml/default_parameters.toml"
