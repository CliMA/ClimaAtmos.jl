# CG twin of aquaplanet_topo_kgpert_DG.yml.
#
# Identical grid, topography, physics, time step and WeatherModel initial
# condition; only the horizontal discretization differs (default CG with the
# default hyperdiffusion, no DG limiter). Purpose: discriminate whether the
# h60 t≈1-2 h crash is DG-specific. Run with the SAME legacy initial
# condition (ic_hydrostatic_rebalance: false) as the DG A/B arm.
#   - CG survives, DG dies  → defect is DG's horizontal response to the
#     hydrostatic-adjustment transient over terrain (flux/metric formulation).
#   - CG also dies          → shared vertical initialization/operator pairing.
config: "sphere"
h_elem: 60
z_elem: 63
z_max: 30000.0
dz_bottom: 30.0
topography: "Earth"
topography_damping_factor: 2.0
mesh_warp_type: "SLEVE"
rad: "allskywithclear"
insolation: "timevarying"
surface_setup: "DefaultMoninObukhov"
turbconv: "edonly_edmfx"
edmfx_sgs_diffusive_flux: true
implicit_diffusion: true
microphysics_model: "0M"
use_sgs_quadrature: true
initial_condition: "WeatherModel"
start_date: "20100701"
output_dir: "/scratch/asridhar/weathertest_cg_twin"
# Legacy IC construction on purpose: the twin must see the same start as the
# DG arm that crashed. Do not enable the rebalance here.
ic_hydrostatic_rebalance: false
dt: "30secs"
t_end: "14days"
approximate_linear_solve_iters: 2
max_newton_iters_ode: 1
diagnostics:
  # Instantaneous snapshots (no reduction_time => not time-averaged)
  - short_name: [ua, va, wa, rv, ta, hus, pfull, rhoa, hur, ts, ke]
    period: 6hours
