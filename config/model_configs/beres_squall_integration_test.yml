# Minimal sphere integration test for Beres squall-line forcing.
# Inherits physics from longrun_aquaplanet_allsky_progedmf_0M.yml
# but uses a coarse phase-speed grid (nc=51) for fast compilation.
# sigma_x = 2500 m (Beres 2004 Section 4 squall-line) is set in nogw_beres_test.toml.
toml: [toml/prognostic_edmfx.toml, toml/nogw_beres_aquaplanet.toml, toml/nogw_beres_test.toml]
