# Larcform1 — Arctic winter boundary layer SCM (Pithan et al. 2016)
# 1-moment microphysics, prognostic EDMFx
#==========================================================================================#
# Atmosphere #
initial_condition: Larcform1
rayleigh_sponge: true

# Surface #
prognostic_surface: PrescribedSST     # Constant temp starting at 250K. Pithan2016 uses sea ice models.
surface_setup: DefaultMoninObukhov
disable_surface_flux_tendency: false

# Numerics
#==========================================================================================#

# Temporal
FLOAT_TYPE: Float32
t_end: 5days                          # Pithan2016 runs 20days with analysis over first 10
dt: 120secs
dt_rad: 30mins

# Spatial #
config: "column"
z_max: 9000.0                         # Pithan models were in pressure coords running up to roughly ~160hPa
z_elem: 90
z_stretch: true # clw and z-banding both appear very sensitive to this
dz_bottom: 10.0

# Solver #
approximate_linear_solve_iters: 2
ode_algo: ARS222

# Model Components
#==========================================================================================#

# Parameters #
toml: [toml/prognostic_edmfx_1M.toml]

# Radiation #
rad: allskywithclear
insolation: larcform1     # This just zeros out incident shortwave radiation

# Turbulence and EDMF #
#vert_diff: DecayWithHeightDiffusion
turbconv: prognostic_edmfx
implicit_diffusion: true
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
hyperdiff: ~

# Clouds #
cloud_model: quadrature
microphysics_model: 1M

# Logging and Diagnostics
#==========================================================================================#
log_to_file: true
check_conservation: false
netcdf_output_at_levels: true
output_default_diagnostics: false

diagnostics:
#== Atmospheric State ==#
  - short_name: [ta, thetaa, pfull, hus, hur, ts, tas]
    period: 1hours
    reduction_time: average
#== Winds & Dynamics ==#
  - short_name: [ua, wa]
    period: 1hours
    reduction_time: average
#== Clouds & Condensates ==#
  - short_name: [cl, clw, cli, lwp, clivi]
    period: 1hours
    reduction_time: average
#== Radiation Fluxes ==#
  - short_name: [rlu, rld, rlut, rlus, rlds, rsdt, rlutcs, rldscs]    # What can we trim here?
    period: 1hours
    reduction_time: average
#== Precipitation & Evaporation ==#
  - short_name: [pr, prsn, evspsbl, husra, hussn]
    period: 1hours
    reduction_time: average
#== Surface Heat Fluxes ==#
  - short_name: [hfss, hfls]
    period: 1hours
    reduction_time: average

