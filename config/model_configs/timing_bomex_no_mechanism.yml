# Chemistry timing test (0 species): Bomex column, no chemistry mechanism (no tracers).
# Matched to timing_bomex_abba (3 species) and timing_bomex_jpm (15 species):
# identical dynamics, resolution, dt, t_end, and I/O. The ONLY difference across
# the trio is the chemistry mechanism, so SYPD differences isolate chemistry cost.
initial_condition: "Bomex"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
config: "column"
z_max: 3e3
z_elem: 60
z_stretch: false
perturb_initstate: false
dt: "120secs"
t_end: "6hours"
dt_save_state_to_disk: "Inf"
log_progress: false
toml: [toml/prognostic_edmfx_bomex.toml]
netcdf_interpolation_num_points: [2, 2, 60]
ode_algo: "ARS222"
output_default_diagnostics: false
