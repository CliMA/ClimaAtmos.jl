# Discretization-comparison family: 0M microphysics, EDonly EDMFX, Earth
# topography, WeatherModel IC, h_elem 60, dt 30 s. The three members differ
# ONLY in the horizontal discretization block below:
#   edonly_0M_cg.yml          CG + default hyperdiffusion
#   edonly_0M_dg_es.yml       DG vector-invariant, ES penalties
#   edonly_0M_dg_rusanov.yml  DG vector-invariant, Rusanov penalties
#
# ---- Discretization: DG vector-invariant, entropy-variable (ES) face penalties ----
horizontal_discretization: "DG"
dg_equation_form: "vi"
dg_vi_interface_flux: "es"
hyperdiff: ~
apply_zhang_shu_limiter: true
update_constrain_state_every: "stage"
output_dir: "/scratch/asridhar/disc_0M_edonly_dg_es"

# ---- Shared settings (identical across the edonly_0M_* family) ----
config: "sphere"
h_elem: 60
z_elem: 63
z_max: 30000.0
dz_bottom: 30.0
dt_rad: "1hours"
topography: "Earth"
topography_damping_factor: 2.0
mesh_warp_type: "SLEVE"
rad: "allskywithclear"
insolation: "timevarying"
surface_setup: "DefaultMoninObukhov"
turbconv: "edonly_edmfx"
edmfx_sgs_diffusive_flux: true
implicit_diffusion: true
microphysics_model: "0M"
use_sgs_quadrature: true
initial_condition: "WeatherModel"
start_date: "20100701"
# Rebalance the IC column pressure against the model's discrete Exner-split
# vertical PGF
ic_hydrostatic_rebalance: true
# era5_initial_condition_dir: ~   # default (~) uses the wxquest_initial_conditions ClimaArtifact
era5_ic_full_pressure: true # false = hydrostatic p from surface pressure; true = read 3D p from file
dt: "30secs"
t_end: "7days"
approximate_linear_solve_iters: 2
max_newton_iters_ode: 1
diagnostics:
  # Instantaneous snapshots (no reduction_time => not time-averaged)
  - short_name: [ua, va, wa, rv, ta, hus, pfull, rhoa, hur, ts, ke, pr, clw, cli, lwp, clivi]
    period: 6hours
