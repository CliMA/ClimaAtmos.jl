# Chemistry timing test (0 species): aquaplanet, no chemistry mechanism (no tracers).
# Matched to timing_aquaplanet_abba (3 species) and timing_aquaplanet_jpm (15
# species): identical dynamics, resolution, dt, t_end, and I/O. The ONLY
# difference across the trio is the chemistry mechanism, so SYPD differences
# isolate chemistry cost. (Low top / coarse vertical res so the job is tractable.)
z_max: 30000.0
z_elem: 10
dz_bottom: 500.0
dt: 20secs
t_end: 1hours
surface_setup: DefaultMoninObukhov
rad: clearsky
turbconv: prognostic_edmfx
prognostic_tke: true
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
implicit_diffusion: true
approximate_linear_solve_iters: 2
microphysics_model: "0M"
toml: [toml/prognostic_edmfx.toml]
dt_save_state_to_disk: "Inf"
log_progress: false
output_default_diagnostics: false
ode_algo: "ARS222"
config: sphere
h_elem: 6 # 550 km
nh_poly: 3
hyperdiff: Hyperdiffusion
rayleigh_sponge: true
viscous_sponge: true
max_newton_iters_ode: 1
