# SOCRATES ClimaAtmos calibration experiment config.
# Cases: 5 Obs + 6 ERA = 11 (RF11 has ERA only; no Obs Atlas artifact).

prior_path: priors/prior.toml
model_config: configs/model_config.yml
output_dir: socrates_calibration

ensemble_size: 4
n_iterations: 1
batch_size: 11

# Atmos diagnostic short names used for y / G (editable).
y_var_names: [clw, husra, cli, hussn, lwp, iwp, rwp, swp]
# Profile vars are vertically masked by z_bounds; path vars are scalars.
profile_vars: [clw, husra, cli, hussn]
path_vars: [lwp, iwp, rwp, swp]

# Atlas 2020 Obs-based analysis window: hours 10–12 of 12 h runs.
obs_y_t_start_sec: 36000.0
obs_y_t_end_sec: 43200.0
# ERA5-based: window around reference time ~hour 12 within 14 h runs.
era_y_t_start_sec: 39600.0
era_y_t_end_sec: 46800.0

# Diagonal observation noise (placeholder; edit freely).
const_noise_by_var:
  clw: 1.0e-10
  husra: 1.0e-10
  cli: 1.0e-10
  hussn: 1.0e-10
  lwp: 1.0e-6
  iwp: 1.0e-6
  rwp: 1.0e-6
  swp: 1.0e-6

cases:
  - name: RF01_Obs
    flight_number: 1
    forcing_type: Obs
  - name: RF01_ERA
    flight_number: 1
    forcing_type: ERA5
  - name: RF09_Obs
    flight_number: 9
    forcing_type: Obs
  - name: RF09_ERA
    flight_number: 9
    forcing_type: ERA5
  - name: RF10_Obs
    flight_number: 10
    forcing_type: Obs
  - name: RF10_ERA
    flight_number: 10
    forcing_type: ERA5
  - name: RF11_ERA
    flight_number: 11
    forcing_type: ERA5
  - name: RF12_Obs
    flight_number: 12
    forcing_type: Obs
  - name: RF12_ERA
    flight_number: 12
    forcing_type: ERA5
  - name: RF13_Obs
    flight_number: 13
    forcing_type: Obs
  - name: RF13_ERA
    flight_number: 13
    forcing_type: ERA5
