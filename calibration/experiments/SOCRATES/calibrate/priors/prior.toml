# Example seed prior for SOCRATES Atmos 1M microphysics knobs.
# Edit freely — scaffolding loads this via ClimaCalibrate.get_prior.

[condensation_evaporation_timescale]
prior = "constrained_gaussian(condensation_evaporation_timescale, 100.0, 50.0, 1.0, Inf)"
type = "float"

[sublimation_deposition_timescale]
prior = "constrained_gaussian(sublimation_deposition_timescale, 100.0, 50.0, 1.0, Inf)"
type = "float"

[rain_autoconversion_timescale]
prior = "constrained_gaussian(rain_autoconversion_timescale, 150.0, 75.0, 1.0, Inf)"
type = "float"

[snow_autoconversion_timescale]
prior = "constrained_gaussian(snow_autoconversion_timescale, 1.0e4, 5.0e3, 1.0, Inf)"
type = "float"
