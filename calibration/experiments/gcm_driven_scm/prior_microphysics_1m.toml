# Priors for the 1M microphysics + cloud fraction SCM calibration. These
# match the global AMIP calibration campaign's priors (ClimaCoupler
# lwp_clt_swcre_5d_relax_amip) so posteriors compare across the ladder.
#
# The q_liq and eps_rel priors are written as explicit unconstrained
# normals: constrained_gaussian silently returns a unit normal for targets
# with magnitudes below ~1e-2 (the optimizer's absolute tolerances are met
# at its start point and the post-fit check also passes). The normals below
# were solved in sigma-scaled units and verified by sampling.

[cloud_liquid_water_specific_humidity_autoconversion_threshold]
# target constrained moments: mean 1.8e-4, std 0.6e-4
prior = "Parameterized(Normal(-1.5689479628642062, 0.41028861159355573))"
constraint = "bounded(0.0, 1.0e-3)"
type = "float"

[rain_autoconversion_timescale]
prior = "constrained_gaussian(rain_autoconversion_timescale, 1800, 400, 300, 3600)"
type = "float"

[snow_autoconversion_timescale]
prior = "constrained_gaussian(snow_autoconversion_timescale, 1800, 400, 300, 3600)"
type = "float"

[condensation_evaporation_timescale]
prior = "constrained_gaussian(condensation_evaporation_timescale, 150, 100, 20, 3600)"
type = "float"

[sublimation_deposition_timescale]
prior = "constrained_gaussian(sublimation_deposition_timescale, 500, 400, 20, 3600)"
type = "float"

[cloud_fraction_floor_release_abs_margin]
prior = "constrained_gaussian(cloud_fraction_floor_release_abs_margin, 1, 0.5, 0, 2)"
type = "float"

[cloud_fraction_eps_rel]
# target constrained moments: mean 0.04, std 0.02
prior = "Parameterized(Normal(-1.5363242404989426, 0.660733741974164))"
constraint = "bounded(0.001, 0.2)"
type = "float"

[cloud_fraction_steepness_scale]
prior = "constrained_gaussian(cloud_fraction_steepness_scale, 0.7, 0.2, 0.1, 2.0)"
type = "float"
