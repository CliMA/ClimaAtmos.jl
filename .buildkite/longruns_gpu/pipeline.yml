agents:
  queue: clima
  slurm_mem: 8G
  modules: climacommon/2025_03_18 nsight-systems/2024.6.1

env:
  JULIA_MPI_HAS_CUDA: "true"
  JULIA_NVTX_CALLBACKS: gc
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  OPENBLAS_NUM_THREADS: 1
  OMPI_MCA_opal_warn_on_missing_libcuda: 0
  SLURM_KILL_BAD_EXIT: 1
  SLURM_GRES_FLAGS: "allow-task-sharing"
  CONFIG_PATH: "config/hierarchy_configs"
  CLIMAATMOS_GC_NSTEPS: 10

timeout_in_minutes: 1440

steps:
  - label: "init :GPU:"
    key: "init_gpu_env"
    command:
      - echo "--- Instantiate examples"
      - julia --project=.buildkite -e 'using Pkg; Pkg.instantiate(;verbose=true)'
      - julia --project=.buildkite -e 'using Pkg; Pkg.precompile()'
      - julia --project=.buildkite -e 'using CUDA; CUDA.precompile_runtime()'
      - julia --project=.buildkite -e 'using Pkg; Pkg.status()'

    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8
      JULIA_MAX_NUM_PRECOMPILE_FILES: 50

  - wait

  # Model hierarchy of increasing physics complexity, all sharing h_elem = 16
  # (~206 km), nh_poly = 3, dt = 120 s, dz_bottom = 30 m, and 0-moment
  # microphysics. Numerics come from the `numerics_sphere_he16ze*` files in
  # `CONFIG_PATH`, which are merged before the case config so the case can
  # override them.
  #
  # The moist baroclinic wave uses the 30 km / 43-level domain: it needs no
  # sponge, and (having no `vert_diff` or `turbconv`) it cannot run with the
  # implicit diffusion that the deep-domain numerics turn on. Every other case
  # shares the 60 km / 63-level grid; the aquaplanets require that depth because
  # the non-orographic gravity wave drag damps at `nogw_damp_pressure` = 85 Pa
  # (~65 km), above a 30 km lid.
  - group: "hierarchy he16"
    steps:

      - label: ":cyclone: moist baroclinic wave"
        # skip: "temporarily disabled; running aquaplanets first"
        command: >
          srun julia --color=yes --project=.buildkite .buildkite/ci_driver.jl
          --config_file $CONFIG_PATH/$$GRID.yml
          --config_file $CONFIG_PATH/$$JOB_NAME.yml
          --job_id $$JOB_NAME
        artifact_paths: "$$JOB_NAME/output_active/*"
        agents:
          slurm_gpus: 1
          slurm_time: 12:00:00
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          GRID: "numerics_sphere_he16ze43"
          JOB_NAME: "moist_baroclinic_wave"

      - label: ":computer: dry held-suarez"
        skip: "temporarily disabled"
        command: >
          srun julia --color=yes --project=.buildkite .buildkite/ci_driver.jl
          --config_file $CONFIG_PATH/$$GRID.yml
          --config_file $CONFIG_PATH/$$JOB_NAME.yml
          --job_id $$JOB_NAME
        artifact_paths: "$$JOB_NAME/output_active/*"
        agents:
          slurm_gpus: 1
          slurm_time: 12:00:00
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          GRID: "numerics_sphere_he16ze63"
          JOB_NAME: "dry_held_suarez"

      - label: ":computer: moist held-suarez"
        skip: "temporarily disabled"
        command: >
          srun julia --color=yes --project=.buildkite .buildkite/ci_driver.jl
          --config_file $CONFIG_PATH/$$GRID.yml
          --config_file $CONFIG_PATH/$$JOB_NAME.yml
          --job_id $$JOB_NAME
        artifact_paths: "$$JOB_NAME/output_active/*"
        agents:
          slurm_gpus: 1
          slurm_time: 24:00:00
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          GRID: "numerics_sphere_he16ze63"
          JOB_NAME: "moist_held_suarez"

      - label: ":sunny: aquaplanet clearsky radiation + prognostic edmf"
        skip: "temporarily disabled"
        command: >
          srun julia --color=yes --project=.buildkite .buildkite/ci_driver.jl
          --config_file $CONFIG_PATH/$$GRID.yml
          --config_file $CONFIG_PATH/$$JOB_NAME.yml
          --job_id $$JOB_NAME
        artifact_paths: "$$JOB_NAME/output_active/*"
        agents:
          slurm_gpus: 1
          slurm_time: 24:00:00
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          GRID: "numerics_sphere_he16ze63"
          JOB_NAME: "aquaplanet_clearsky"

      - label: ":umbrella: aquaplanet allsky radiation + prognostic edmf"
        skip: "temporarily disabled"
        command: >
          srun julia --color=yes --project=.buildkite .buildkite/ci_driver.jl
          --config_file $CONFIG_PATH/$$GRID.yml
          --config_file $CONFIG_PATH/$$JOB_NAME.yml
          --job_id $$JOB_NAME
        artifact_paths: "$$JOB_NAME/output_active/*"
        agents:
          slurm_gpus: 1
          slurm_time: 24:00:00
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          GRID: "numerics_sphere_he16ze63"
          JOB_NAME: "aquaplanet_allsky"
