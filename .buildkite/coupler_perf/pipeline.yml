# Temporary comparison pipeline (not for merging), on one A100 per job: perf/profile_amip_steps.jl
# traces 20 coupling steps of the flagship AMIP benchmark, and Nsight Compute counts one coupling
# step, for one ClimaAtmos tree in environments that differ only in CloudMicrophysics:
# main (CloudMicrophysics 02ce32fbda11974f939a9fafcb30cce6a086b609), pr (CloudMicrophysics 2caabd14417e5e4ad0a064aa40d58e36782428bf), clean (CloudMicrophysics 8b560da11176784a65b71190101b9e4fd6a0dba1), t1 (CloudMicrophysics c83d0b8c124997a01f7af6992d401e790fcb6a78), t1_solve (CloudMicrophysics e47a7cb3b80cc6786f9ccd34655ae6ca4a4db323), t1_clamp (CloudMicrophysics c1c5bf07798dea7cf671cec31e8377fe8f6fbfeb).
# Every environment has the dy/params_macro branches of ClimaParams, Thermodynamics, and
# SurfaceFluxes, the ClimaCore that the coupler environment resolves, and the cache, tendency, and
# Jacobian functions marked with NVTX ranges (perf/annotate_components.py).
agents:
  queue: clima
  slurm_time: 8:00:00
  modules: climacommon/2026_11_06-1.13.3

env:
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/${BUILDKITE_BUILD_NUMBER}/depot:${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/shared"
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  GKSwstype: 100
  SLURM_KILL_BAD_EXIT: 1
  CLIMACOMMS_DEVICE: "CUDA"
  CLIMA_NAME_CUDA_KERNELS_FROM_STACK_TRACE: "true"
  PROFILE_DIR: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/${BUILDKITE_BUILD_NUMBER}/profile"
  # ClimaCoupler main, whose AMIP environment resolves CUDA 6 and GPUCompiler 2
  COUPLER_COMMIT: "ff8318886e257c33b864b09c540f74f718ebcd58"
  CLIMAATMOS_COMMIT: "016af2cb6a148ada0858edcc395951ddeefbf603"
  AMIP_CONFIG: "config/benchmark_configs/amip_progedmf_1m_land_he16.yml"
  # Packages whose [compat] bounds are dropped from the coupler projects at init, as in
  # the end-to-end performance pipeline
  UPSTREAM_PACKAGES: "ClimaAtmos ClimaCore ClimaTimeSteppers Thermodynamics ClimaLand SurfaceFluxes RRTMGP"

timeout_in_minutes: 480

steps:
  - label: "init: ClimaAtmos tree"
    key: "init_trees"
    command:
      - mkdir -p $$PROFILE_DIR
      - git fetch origin $$CLIMAATMOS_COMMIT
      # Start from an empty tree, so that a retried job does not annotate it twice
      - rm -rf $$PROFILE_DIR/ClimaAtmos
      - mkdir -p $$PROFILE_DIR/ClimaAtmos
      - git archive $$CLIMAATMOS_COMMIT | tar -x -C $$PROFILE_DIR/ClimaAtmos
      - python3 perf/annotate_components.py $$PROFILE_DIR/ClimaAtmos
      - cp perf/profile_amip_steps.jl perf/attribute_trace.py perf/annotate_components.py $$PROFILE_DIR/
    agents:
      slurm_cpus_per_task: 1

  - label: "init: flagship AMIP base environment"
    key: "init_amip"
    depends_on: "init_trees"
    command:
      # Start from empty environments, so that a retried job can clone the coupler again
      - rm -rf $$PROFILE_DIR/coupler_base
      - git clone https://github.com/CliMA/ClimaCoupler.jl.git $$PROFILE_DIR/coupler_base
      - bash -c "cd $$PROFILE_DIR/coupler_base && git checkout $$COUPLER_COMMIT"
      # Warn instead of erroring when the pinned coupler TOML sets parameters ClimaAtmos no longer uses
      - "echo 'strict_params: false' >> $$PROFILE_DIR/coupler_base/$$AMIP_CONFIG"
      - |
        julia -e '
          using TOML
          upstream = split(ENV["UPSTREAM_PACKAGES"])
          coupler = joinpath(ENV["PROFILE_DIR"], "coupler_base")
          for project in (coupler, joinpath(coupler, "experiments", "AMIP"))
              file = joinpath(project, "Project.toml")
              toml = TOML.parsefile(file)
              haskey(toml, "compat") || continue
              toml["compat"] = filter(entry -> !(first(entry) in upstream), toml["compat"])
              open(io -> TOML.print(io, toml; sorted = true), file, "w")
          end'
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.Registry.update()'
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.instantiate()'
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.develop(path = joinpath(ENV["PROFILE_DIR"], "ClimaAtmos")); Pkg.add("MPI")'
      # The @params branches of the parameter packages, as the [sources] of ClimaAtmos pin them
      # (which do not apply to direct dependencies of this project)
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.add([PackageSpec(; url = "https://github.com/CliMA/" * name * ".jl", rev = "dy/params_macro") for name in ("ClimaParams", "Thermodynamics", "SurfaceFluxes")])'
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.precompile()'
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8

  - label: "init: flagship AMIP environment main (CloudMicrophysics 02ce32fbda11974f939a9fafcb30cce6a086b609)"
    key: "init_main"
    depends_on: "init_amip"
    command:
      - rm -rf $$PROFILE_DIR/coupler_main
      - cp -r $$PROFILE_DIR/coupler_base $$PROFILE_DIR/coupler_main
      - julia --project=$$PROFILE_DIR/coupler_main/experiments/AMIP -e 'using Pkg; Pkg.add(PackageSpec(; url = "https://github.com/CliMA/CloudMicrophysics.jl", rev = "02ce32fbda11974f939a9fafcb30cce6a086b609"))'
      - julia --project=$$PROFILE_DIR/coupler_main/experiments/AMIP -e 'using Pkg; Pkg.precompile(); Pkg.status()'
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8

  - label: "init: flagship AMIP environment pr (CloudMicrophysics 2caabd14417e5e4ad0a064aa40d58e36782428bf)"
    key: "init_pr"
    depends_on: "init_amip"
