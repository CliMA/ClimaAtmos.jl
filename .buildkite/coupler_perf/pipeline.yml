# Temporary comparison pipeline (not for merging), on one A100 per job:
# - register vs invariant_data: perf/register_vs_invariant.jl times the first call and the
#   runtime of three fused loops of this branch in the modes of CA.LAB_MODE, one process
#   per mode;
# - flagship AMIP components: perf/profile_amip_steps.jl traces 20 coupling steps of the
#   flagship AMIP benchmark for main (MAIN_COMMIT) and for CliMA/ClimaAtmos.jl#4953
#   (PR_COMMIT, with the ClimaCore of CliMA/ClimaCore.jl#2717 at CLIMACORE_COMMIT), with
#   the same coupler and package versions and the cache, tendency, and Jacobian functions
#   of both trees marked with NVTX ranges (perf/annotate_components.py), sums Nsight
#   Compute counters of one coupling step, and attributes both to the components
#   (perf/attribute_trace.py).
agents:
  queue: clima
  slurm_time: 8:00:00
  modules: climacommon/2025_05_15

env:
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/${BUILDKITE_BUILD_NUMBER}/depot:${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/shared"
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  GKSwstype: 100
  SLURM_KILL_BAD_EXIT: 1
  CLIMACOMMS_DEVICE: "CUDA"
  CLIMA_NAME_CUDA_KERNELS_FROM_STACK_TRACE: "true"
  PROFILE_DIR: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/${BUILDKITE_BUILD_NUMBER}/profile"
  COUPLER_COMMIT: "df7923109fd5d45fdf9de603bbb89a90d959bc66"
  MAIN_COMMIT: "d9e7b974d8fe91383885afd890cb4170503255bf"
  PR_COMMIT: "aec642818e8b041c92c4407b1437987b725de20f"
  CLIMACORE_COMMIT: "aef0f5a02264c3bba853a37548fdd4581c4a5105"
  AMIP_CONFIG: "config/benchmark_configs/amip_progedmf_1m_land_he16.yml"
  # Packages whose [compat] bounds are dropped from the coupler projects at init, as in
  # the end-to-end performance pipeline
  UPSTREAM_PACKAGES: "ClimaAtmos ClimaCore ClimaTimeSteppers Thermodynamics ClimaLand SurfaceFluxes RRTMGP"

timeout_in_minutes: 480

steps:
  - label: "init: ClimaCore of CliMA/ClimaCore.jl#2717 and source trees"
    key: "init_trees"
    command:
      - mkdir -p $$PROFILE_DIR
      - git clone https://github.com/CliMA/ClimaCore.jl.git $$PROFILE_DIR/ClimaCore_pr
      - bash -c "cd $$PROFILE_DIR/ClimaCore_pr && git fetch origin $$CLIMACORE_COMMIT && git checkout $$CLIMACORE_COMMIT"
      - git fetch origin $$MAIN_COMMIT $$PR_COMMIT
      - mkdir -p $$PROFILE_DIR/lab $$PROFILE_DIR/ClimaAtmos_main $$PROFILE_DIR/ClimaAtmos_pr
      - git archive HEAD | tar -x -C $$PROFILE_DIR/lab
      - git archive $$MAIN_COMMIT | tar -x -C $$PROFILE_DIR/ClimaAtmos_main
      - git archive $$PR_COMMIT | tar -x -C $$PROFILE_DIR/ClimaAtmos_pr
      - python3 perf/annotate_components.py $$PROFILE_DIR/ClimaAtmos_main
      - python3 perf/annotate_components.py $$PROFILE_DIR/ClimaAtmos_pr
      - cp perf/profile_amip_steps.jl perf/attribute_trace.py perf/annotate_components.py $$PROFILE_DIR/
    agents:
      slurm_cpus_per_task: 1

  - label: "init: register vs invariant_data environment"
    key: "init_lab"
    depends_on: "init_trees"
    command:
      # The lab tree's manifest with the ClimaCore checkout of CLIMACORE_COMMIT
      - |
        julia -e '
          import TOML
          dir = ENV["PROFILE_DIR"]
          file = joinpath(dir, "lab", ".buildkite", "Manifest-v1.11.toml")
          manifest = TOML.parsefile(file)
          entry = manifest["deps"]["ClimaCore"][1]
          manifest["deps"]["ClimaCore"][1] = merge(
              filter(p -> !(first(p) in ("repo-rev", "repo-url", "git-tree-sha1")), entry),
              Dict("path" => joinpath(dir, "ClimaCore_pr")),
          )
          open(io -> TOML.print(io, manifest; sorted = true), file, "w")'
      - julia --project=$$PROFILE_DIR/lab/.buildkite -e 'using Pkg; Pkg.instantiate(); Pkg.precompile(); Pkg.status(["ClimaCore", "ClimaAtmos", "CUDA"])'
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8

  - label: "init: flagship AMIP environments of main and the PR"
    key: "init_amip"
    depends_on: "init_trees"
    command:
      - git clone https://github.com/CliMA/ClimaCoupler.jl.git $$PROFILE_DIR/coupler_main
      - bash -c "cd $$PROFILE_DIR/coupler_main && git checkout $$COUPLER_COMMIT"
      # Warn instead of erroring when the pinned coupler TOML sets parameters ClimaAtmos no longer uses
      - "echo 'strict_params: false' >> $$PROFILE_DIR/coupler_main/$$AMIP_CONFIG"
      - |
        julia -e '
          using TOML
          upstream = split(ENV["UPSTREAM_PACKAGES"])
          coupler = joinpath(ENV["PROFILE_DIR"], "coupler_main")
          for project in (coupler, joinpath(coupler, "experiments", "AMIP"))
              file = joinpath(project, "Project.toml")
              toml = TOML.parsefile(file)
              haskey(toml, "compat") || continue
              toml["compat"] = filter(entry -> !(first(entry) in upstream), toml["compat"])
              open(io -> TOML.print(io, toml; sorted = true), file, "w")
          end'
      - julia --project=$$PROFILE_DIR/coupler_main/experiments/AMIP -e 'using Pkg; Pkg.Registry.update()'
      - echo "--- main environment"
      - julia --project=$$PROFILE_DIR/coupler_main/experiments/AMIP -e 'using Pkg; Pkg.instantiate()'
      - julia --project=$$PROFILE_DIR/coupler_main/experiments/AMIP -e 'using Pkg; Pkg.develop(path = joinpath(ENV["PROFILE_DIR"], "ClimaAtmos_main")); Pkg.add("MPI")'
      - julia --project=$$PROFILE_DIR/coupler_main/experiments/AMIP -e 'using Pkg; Pkg.precompile(); Pkg.status()'
      # The PR environment differs from the main environment only in ClimaAtmos and ClimaCore
      - echo "--- PR environment"
      - cp -r $$PROFILE_DIR/coupler_main $$PROFILE_DIR/coupler_pr
      - julia --project=$$PROFILE_DIR/coupler_pr/experiments/AMIP -e 'using Pkg; Pkg.develop([PackageSpec(path = joinpath(ENV["PROFILE_DIR"], "ClimaAtmos_pr")), PackageSpec(path = joinpath(ENV["PROFILE_DIR"], "ClimaCore_pr"))])'
      - julia --project=$$PROFILE_DIR/coupler_pr/experiments/AMIP -e 'using Pkg; Pkg.precompile(); Pkg.status()'
      - echo "--- Manifest differences between the PR and main environments"
      - diff $$PROFILE_DIR/coupler_main/experiments/AMIP/Manifest-v1.11.toml $$PROFILE_DIR/coupler_pr/experiments/AMIP/Manifest-v1.11.toml || true
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8

  - label: "register vs invariant_data (A100): first calls, runtimes, kernels, and outputs of each mode"
    key: "lab"
    depends_on: "init_lab"
    command:
      - nvidia-smi -L
      - for mode in base inv reg reg_struct base; do echo "--- mode $$mode"; julia --color=yes --project=$$PROFILE_DIR/lab/.buildkite $$PROFILE_DIR/lab/perf/register_vs_invariant.jl $$mode || exit 1; done
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP components (A100): CUDA traces of 20 coupling steps of main and the PR"
    key: "amip_trace"
    depends_on: "init_amip"
    command:
      - nvidia-smi -L
      - for tree in main pr; do echo "--- $$tree"; PROFILE_OUT=$$PROFILE_DIR/trace_$$tree COUPLER_DIR=$$PROFILE_DIR/coupler_$$tree julia --threads=3 --color=yes --project=$$PROFILE_DIR/coupler_$$tree/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_$$tree/$$AMIP_CONFIG --job_id trace_$$tree || exit 1; tar czf trace_$$tree.tgz -C $$PROFILE_DIR trace_$$tree; done
      - echo "--- Device time per component and step"
      - cd $$PROFILE_DIR && python3 attribute_trace.py pr=trace_pr main=trace_main
    artifact_paths: "trace_*.tgz"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP components (A100): Nsight Compute counters of one coupling step of main and the PR"
    key: "amip_ncu"
    depends_on: "init_amip"
    soft_fail: true
    command:
      - nvidia-smi -L
      - |
        available=$$(ncu --query-metrics --chip ga100 | awk '{print $$1}')
        metrics="gpu__time_duration.sum,launch__grid_size,launch__block_size,dram__bytes_read.sum,dram__bytes_write.sum,smsp__inst_executed_op_global_ld.sum,smsp__inst_executed_op_global_st.sum"
        for m in smsp__sass_thread_inst_executed_op_global_ld_pred_on smsp__sass_thread_inst_executed_op_global_st_pred_on; do
            echo "$$available" | grep -qx $$m && metrics="$$metrics,$$m.sum"
        done
        echo "metrics: $$metrics"
        for tree in main pr; do
            echo "--- $$tree under Nsight Compute"
            PROFILE_MODE=ncu PROFILE_OUT=$$PROFILE_DIR/ncu_$$tree COUPLER_DIR=$$PROFILE_DIR/coupler_$$tree ncu --profile-from-start off --print-units base --csv --page raw --metrics $$metrics --log-file ncu_$$tree.csv julia --threads=3 --project=$$PROFILE_DIR/coupler_$$tree/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_$$tree/$$AMIP_CONFIG --job_id ncu_$$tree || exit 1
            cp ncu_$$tree.csv $$PROFILE_DIR/
        done
    artifact_paths: "ncu_*.csv"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP components: device time and counters per component"
    key: "amip_summary"
    depends_on:
      - "amip_trace"
      - "amip_ncu"
    allow_dependency_failure: true
    command:
      - cd $$PROFILE_DIR && python3 attribute_trace.py pr=trace_pr,ncu_pr.csv main=trace_main,ncu_main.csv
    agents:
      slurm_cpus_per_task: 1
