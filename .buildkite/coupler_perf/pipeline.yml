  - label: "flagship AMIP (A100), CloudMicrophysics 02ce32fbda11974f939a9fafcb30cce6a086b609: CUDA trace of 20 coupling steps"
    key: "trace_main"
    depends_on: "init_main"
    command:
      - nvidia-smi -L
      - PROFILE_OUT=$$PROFILE_DIR/trace_main COUPLER_DIR=$$PROFILE_DIR/coupler_main julia --threads=3 --color=yes --project=$$PROFILE_DIR/coupler_main/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_main/$$AMIP_CONFIG --job_id trace_main
      - tar czf trace_main.tgz -C $$PROFILE_DIR trace_main
    artifact_paths: "trace_main.tgz"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP (A100), CloudMicrophysics 02ce32fbda11974f939a9fafcb30cce6a086b609: Nsight Compute counters of one coupling step"
    key: "ncu_main"
    depends_on: "init_main"
    command:
      - nvidia-smi -L
      - |
        available=$$(ncu --query-metrics --chip ga100 | awk '{print $$1}')
        metrics="gpu__time_duration.sum,launch__grid_size,launch__block_size,dram__bytes_read.sum,dram__bytes_write.sum,smsp__inst_executed_op_global_ld.sum,smsp__inst_executed_op_global_st.sum,smsp__inst_executed.sum,smsp__issue_active.avg,smsp__warps_active.avg,sm__warps_active.avg.pct_of_peak_sustained_active,launch__occupancy_limit_registers,smsp__sass_thread_inst_executed_op_ffma_pred_on.sum,smsp__sass_thread_inst_executed_op_fadd_pred_on.sum,smsp__sass_thread_inst_executed_op_fmul_pred_on.sum,smsp__sass_thread_inst_executed_op_dfma_pred_on.sum,smsp__sass_thread_inst_executed_op_dadd_pred_on.sum,smsp__sass_thread_inst_executed_op_dmul_pred_on.sum"
        for m in smsp__sass_thread_inst_executed_op_global_ld_pred_on smsp__sass_thread_inst_executed_op_global_st_pred_on; do
            echo "$$available" | grep -qx $$m && metrics="$$metrics,$$m.sum"
        done
        PROFILE_MODE=ncu PROFILE_OUT=$$PROFILE_DIR/ncu_main COUPLER_DIR=$$PROFILE_DIR/coupler_main ncu --profile-from-start off --print-units base --csv --page raw --metrics $$metrics --log-file ncu_main.csv julia --threads=3 --project=$$PROFILE_DIR/coupler_main/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_main/$$AMIP_CONFIG --job_id ncu_main || exit 1
        cp ncu_main.csv $$PROFILE_DIR/
    artifact_paths: "ncu_main.csv"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

