# Temporary comparison pipeline (not for merging), on one A100 per job: perf/profile_amip_steps.jl
# traces 20 coupling steps of the flagship AMIP benchmark for two ClimaAtmos trees (base and new,
# both with the dy/params_macro branches of ClimaParams, Thermodynamics, SurfaceFluxes, and
# CloudMicrophysics in "type" mode), with the cache, tendency, and Jacobian functions marked with
# NVTX ranges (perf/annotate_components.py). A trace job may set environment variables that a tree
# reads. perf/attribute_trace.py attributes the device time to the components.
agents:
  queue: clima
  slurm_time: 8:00:00
  modules: climacommon/2026_11_06-1.13.3

env:
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/${BUILDKITE_BUILD_NUMBER}/depot:${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/shared"
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  GKSwstype: 100
  SLURM_KILL_BAD_EXIT: 1
  CLIMACOMMS_DEVICE: "CUDA"
  CLIMA_NAME_CUDA_KERNELS_FROM_STACK_TRACE: "true"
  PROFILE_DIR: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/${BUILDKITE_BUILD_NUMBER}/profile"
  # ClimaCoupler main, whose AMIP environment resolves CUDA 6 and GPUCompiler 2
  COUPLER_COMMIT: "ff8318886e257c33b864b09c540f74f718ebcd58"
  CLIMAATMOS_BASE_COMMIT: "084175d9815d76a7808d60c5e3d59a3332e2b43c"
  CLIMAATMOS_NEW_COMMIT: "36ee3f65218e5764e926a9ac982e21d0944bc697"
  AMIP_CONFIG: "config/benchmark_configs/amip_progedmf_1m_land_he16.yml"
  # Packages whose [compat] bounds are dropped from the coupler projects at init, as in
  # the end-to-end performance pipeline
  UPSTREAM_PACKAGES: "ClimaAtmos ClimaCore ClimaTimeSteppers Thermodynamics ClimaLand SurfaceFluxes RRTMGP"

timeout_in_minutes: 480

steps:
  - label: "init: ClimaAtmos trees base and new"
    key: "init_trees"
    command:
      - mkdir -p $$PROFILE_DIR
      - git fetch origin $$CLIMAATMOS_BASE_COMMIT $$CLIMAATMOS_NEW_COMMIT
      # Start from empty trees, so that a retried job does not annotate them twice
      - rm -rf $$PROFILE_DIR/ClimaAtmos_base $$PROFILE_DIR/ClimaAtmos_new
      - mkdir -p $$PROFILE_DIR/ClimaAtmos_base $$PROFILE_DIR/ClimaAtmos_new
      - git archive $$CLIMAATMOS_BASE_COMMIT | tar -x -C $$PROFILE_DIR/ClimaAtmos_base
      - git archive $$CLIMAATMOS_NEW_COMMIT | tar -x -C $$PROFILE_DIR/ClimaAtmos_new
      - python3 perf/annotate_components.py $$PROFILE_DIR/ClimaAtmos_base
      - python3 perf/annotate_components.py $$PROFILE_DIR/ClimaAtmos_new
      - cp perf/profile_amip_steps.jl perf/attribute_trace.py perf/annotate_components.py $$PROFILE_DIR/
    agents:
      slurm_cpus_per_task: 1

  - label: "init: flagship AMIP environments base and new"
    key: "init_amip"
    depends_on: "init_trees"
    command:
      # Start from empty environments, so that a retried job can clone the coupler again
      - rm -rf $$PROFILE_DIR/coupler_base $$PROFILE_DIR/coupler_new
      - git clone https://github.com/CliMA/ClimaCoupler.jl.git $$PROFILE_DIR/coupler_base
      - bash -c "cd $$PROFILE_DIR/coupler_base && git checkout $$COUPLER_COMMIT"
      # Warn instead of erroring when the pinned coupler TOML sets parameters ClimaAtmos no longer uses
      - "echo 'strict_params: false' >> $$PROFILE_DIR/coupler_base/$$AMIP_CONFIG"
      - |
        julia -e '
          using TOML
          upstream = split(ENV["UPSTREAM_PACKAGES"])
          coupler = joinpath(ENV["PROFILE_DIR"], "coupler_base")
          for project in (coupler, joinpath(coupler, "experiments", "AMIP"))
              file = joinpath(project, "Project.toml")
              toml = TOML.parsefile(file)
              haskey(toml, "compat") || continue
              toml["compat"] = filter(entry -> !(first(entry) in upstream), toml["compat"])
              open(io -> TOML.print(io, toml; sorted = true), file, "w")
          end'
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.Registry.update()'
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.instantiate()'
      - echo "--- base"
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.develop(path = joinpath(ENV["PROFILE_DIR"], "ClimaAtmos_base")); Pkg.add("MPI")'
      # The @params branches of the parameter packages, as the [sources] of ClimaAtmos pin them
      # (which do not apply to direct dependencies of this project)
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.add([PackageSpec(; url = "https://github.com/CliMA/" * name * ".jl", rev = "dy/params_macro") for name in ("ClimaParams", "Thermodynamics", "SurfaceFluxes", "CloudMicrophysics")])'
      # The parameter structs take their mode from the preferences of the active project
      - 'printf "[ClimaParams]\nCLIMA_PARAMS_MODE = \"type\"\n" > $$PROFILE_DIR/coupler_base/experiments/AMIP/LocalPreferences.toml'
      - julia --project=$$PROFILE_DIR/coupler_base/experiments/AMIP -e 'using Pkg; Pkg.precompile(); Pkg.status()'
      - echo "--- new"
      - cp -r $$PROFILE_DIR/coupler_base $$PROFILE_DIR/coupler_new
      - julia --project=$$PROFILE_DIR/coupler_new/experiments/AMIP -e 'using Pkg; Pkg.develop(path = joinpath(ENV["PROFILE_DIR"], "ClimaAtmos_new"))'
      - julia --project=$$PROFILE_DIR/coupler_new/experiments/AMIP -e 'using Pkg; Pkg.precompile(); Pkg.status()'
      - echo "--- Manifest differences"
      - diff $$PROFILE_DIR/coupler_base/experiments/AMIP/Manifest.toml $$PROFILE_DIR/coupler_new/experiments/AMIP/Manifest.toml || true
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8

  - label: "flagship AMIP (A100), base tree: CUDA trace of 20 coupling steps"
    key: "trace_base"
    depends_on: "init_amip"
    command:
      - nvidia-smi -L
      - PROFILE_OUT=$$PROFILE_DIR/trace_base COUPLER_DIR=$$PROFILE_DIR/coupler_base julia --threads=3 --color=yes --project=$$PROFILE_DIR/coupler_base/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_base/$$AMIP_CONFIG --job_id trace_base
      - tar czf trace_base.tgz -C $$PROFILE_DIR trace_base
    artifact_paths: "trace_base.tgz"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP (A100), new tree: CUDA trace of 20 coupling steps"
    key: "trace_new"
    depends_on: "init_amip"
    command:
      - nvidia-smi -L
      - PROFILE_OUT=$$PROFILE_DIR/trace_new COUPLER_DIR=$$PROFILE_DIR/coupler_new julia --threads=3 --color=yes --project=$$PROFILE_DIR/coupler_new/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_new/$$AMIP_CONFIG --job_id trace_new
      - tar czf trace_new.tgz -C $$PROFILE_DIR trace_new
    artifact_paths: "trace_new.tgz"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP (A100), new tree (CA_REGCAP_ENV=128 CA_REGCAP_ENV_I=85 CA_REGCAP_UPD=102 CA_REGCAP_UPD_I=85): CUDA trace of 20 coupling steps"
    key: "trace_capB"
    depends_on: "init_amip"
    command:
      - nvidia-smi -L
      - CA_REGCAP_ENV=128 CA_REGCAP_ENV_I=85 CA_REGCAP_UPD=102 CA_REGCAP_UPD_I=85 PROFILE_OUT=$$PROFILE_DIR/trace_capB COUPLER_DIR=$$PROFILE_DIR/coupler_new julia --threads=3 --color=yes --project=$$PROFILE_DIR/coupler_new/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_new/$$AMIP_CONFIG --job_id trace_capB
      - tar czf trace_capB.tgz -C $$PROFILE_DIR trace_capB
    artifact_paths: "trace_capB.tgz"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP (A100), new tree (CA_REGCAP_ENV=102 CA_REGCAP_ENV_I=73 CA_REGCAP_UPD=85 CA_REGCAP_UPD_I=73): CUDA trace of 20 coupling steps"
    key: "trace_capC"
    depends_on: "init_amip"
    command:
      - nvidia-smi -L
      - CA_REGCAP_ENV=102 CA_REGCAP_ENV_I=73 CA_REGCAP_UPD=85 CA_REGCAP_UPD_I=73 PROFILE_OUT=$$PROFILE_DIR/trace_capC COUPLER_DIR=$$PROFILE_DIR/coupler_new julia --threads=3 --color=yes --project=$$PROFILE_DIR/coupler_new/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_new/$$AMIP_CONFIG --job_id trace_capC
      - tar czf trace_capC.tgz -C $$PROFILE_DIR trace_capC
    artifact_paths: "trace_capC.tgz"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP (A100), new tree (CA_REGCAP_ENV=85 CA_REGCAP_ENV_I=64 CA_REGCAP_UPD=73 CA_REGCAP_UPD_I=64): CUDA trace of 20 coupling steps"
    key: "trace_capD"
    depends_on: "init_amip"
    command:
      - nvidia-smi -L
      - CA_REGCAP_ENV=85 CA_REGCAP_ENV_I=64 CA_REGCAP_UPD=73 CA_REGCAP_UPD_I=64 PROFILE_OUT=$$PROFILE_DIR/trace_capD COUPLER_DIR=$$PROFILE_DIR/coupler_new julia --threads=3 --color=yes --project=$$PROFILE_DIR/coupler_new/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_new/$$AMIP_CONFIG --job_id trace_capD
      - tar czf trace_capD.tgz -C $$PROFILE_DIR trace_capD
    artifact_paths: "trace_capD.tgz"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP (A100), new tree (CA_REGCAP_ENV=64 CA_REGCAP_ENV_I=48 CA_REGCAP_UPD=64 CA_REGCAP_UPD_I=48): CUDA trace of 20 coupling steps"
    key: "trace_capE"
    depends_on: "init_amip"
    command:
      - nvidia-smi -L
      - CA_REGCAP_ENV=64 CA_REGCAP_ENV_I=48 CA_REGCAP_UPD=64 CA_REGCAP_UPD_I=48 PROFILE_OUT=$$PROFILE_DIR/trace_capE COUPLER_DIR=$$PROFILE_DIR/coupler_new julia --threads=3 --color=yes --project=$$PROFILE_DIR/coupler_new/experiments/AMIP $$PROFILE_DIR/profile_amip_steps.jl --config_file $$PROFILE_DIR/coupler_new/$$AMIP_CONFIG --job_id trace_capE
      - tar czf trace_capE.tgz -C $$PROFILE_DIR trace_capE
    artifact_paths: "trace_capE.tgz"
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
      slurm_mem: 64GB

  - label: "flagship AMIP: device time per component"
    key: "amip_summary"
    depends_on: ["trace_base", "trace_new", "trace_capB", "trace_capC", "trace_capD", "trace_capE"]
    allow_dependency_failure: true
    command:
      - cd $$PROFILE_DIR && (python3 attribute_trace.py trace_base=trace_base trace_new=trace_new || true)
    agents:
      slurm_cpus_per_task: 1
